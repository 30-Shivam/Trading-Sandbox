name: Daily ingest + settle

# Runs daily_run.py (ingest.py then settle_trades.py) on GitHub's own
# runners instead of a local machine, specifically so this doesn't depend
# on a personal PC being powered on at the scheduled time -- see
# improvements.txt/TUTORIAL.md section 9 for the local Task Scheduler
# alternative this supersedes for anyone who wants "runs no matter what."

on:
  schedule:
    # 21:35 UTC = 5:35 PM EDT / 4:35 PM EST -- safely after the US market's
    # 4:00 PM ET close in either daylight-saving state (cron here is
    # UTC-only and does not shift for DST on its own). A non-round minute
    # (not :00) is deliberate -- GitHub's own docs note scheduled runs can
    # queue up and get delayed right at the top of the hour under load.
    - cron: "35 21 * * 1-5"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab, e.g. to test this

jobs:
  daily-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # bumped from 30 -- watchlist.txt widened ~266->~416 tickers
                          # (2026-08-14 expansion), narrowing the fetch-time margin,
                          # see improvements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python daily_run.py
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional per-strategy Discord channels (see notifications.py's
          # get_strategy_webhook_url()) -- each fires only on days that
          # strategy finds a Strong Buy/Buy, falling back to the shared
          # DISCORD_WEBHOOK_URL above if its own secret isn't set. Safe to
          # configure incrementally, one strategy at a time.
          DISCORD_WEBHOOK_URL_BREAKOUT: ${{ secrets.DISCORD_WEBHOOK_URL_BREAKOUT }}
          DISCORD_WEBHOOK_URL_BREAKOUT_RETEST: ${{ secrets.DISCORD_WEBHOOK_URL_BREAKOUT_RETEST }}
          DISCORD_WEBHOOK_URL_WEEK52_HIGH: ${{ secrets.DISCORD_WEBHOOK_URL_WEEK52_HIGH }}
          # LLM Agent (see llm_agent.py, ingest.py's run_llm_agent()) -- any
          # one alone is enough (Gemini primary; Groq then OpenRouter form
          # the secondary fallback pool, see llm_agent.call_secondary()).
          # Without any of the three, llm_agent.is_available() is False and
          # this step silently no-ops, same as every other optional secret
          # here -- add these as repo secrets (Settings -> Secrets and
          # variables -> Actions) to actually start accumulating real
          # llm_agent Trade_Signals on the schedule. OPENROUTER_API_KEY was
          # added 2026-08-22 after a real capacity audit found existing
          # daily automation alone already exceeds Gemini's real 20/day
          # limit -- OpenRouter's free ":free" models need no paid top-up,
          # just an API key from openrouter.ai/keys.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Only needed if your Mongo setup uses a non-default database name
          # (the default is "swingtrade" -- see storage/mongo.py). If you add
          # a MONGODB_DB_NAME repo secret, uncomment the line below to pass
          # it through -- leaving it commented keeps the codebase's own
          # default active rather than accidentally overriding it with an
          # empty string if the secret doesn't exist.
          # MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
      # Catch-all for a failure BEFORE daily_run.py's own internal
      # try/except + notify_github_summary() reporting could even run --
      # e.g. `pip install` itself failing, or a Python-level crash so early
      # (a broken import, a syntax error) that daily_run.py's own
      # notification call at the end of main() is never reached. Every
      # failure daily_run.py itself can see is already double-reported
      # (Discord + GitHub step summary, see its own docstring); this step
      # is specifically for failures ABOVE that layer, per improvements.txt
      # item 2(b)'s own long-flagged gap. Pure shell/curl, no Python or
      # installed dependencies required, so it still runs even if the
      # environment itself is broken. `if: failure()` means this only runs
      # when a PRIOR step in this job failed.
      - name: Notify on early/infra failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "::error title=daily_run.yml FAILED::A step before or including 'python daily_run.py' failed -- see the job log above for which one."
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -sS -X POST -H "Content-Type: application/json" \
              -d "{\"content\": \"[Trading-Sandbox] daily_run.yml FAILED before/during python daily_run.py -- check the Actions run log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
              "$DISCORD_WEBHOOK_URL" || true
          fi
